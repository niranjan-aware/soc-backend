version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: solilos-postgres
    environment:
      POSTGRES_DB: solilos_db
      POSTGRES_USER: solilos_user
      POSTGRES_PASSWORD: solilos_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - solilos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solilos_user -d solilos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solilos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - solilos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  solilos-network:
    driver: bridge
