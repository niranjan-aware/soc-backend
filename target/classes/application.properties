# Application
spring.application.name=solilos

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/solilos_db
spring.datasource.username=solilos_user
spring.datasource.password=solilos_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# File Storage - Changed to user home directory
storage.base-path=${user.home}/solilos-data/repos
storage.cleanup-after-hours=24

# GitHub API
github.api.base-url=https://api.github.com

# Scan Configuration
scan.max-concurrent=3
scan.timeout-minutes=30

# Analysis Tools
semgrep.binary-path=/usr/local/bin/semgrep
tree-sitter.enabled=true

# Groq AI
groq.api.key=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
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Server
server.port=8080

# Logging
logging.level.com.omnigaurd.solilos=INFO
logging.level.org.springframework.web=INFO
